name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test

  backend:
    # Push only: this job holds the Supabase secrets, which code from a pull request must never reach.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ci
    # Every run writes to the same Supabase project, so runs never overlap. GitHub keeps one
    # waiting run per group: a newer push replaces an older one that is still waiting.
    concurrency:
      group: supabase-dev
      cancel-in-progress: false
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          version: "0.8.11" # the uv that wrote uv.lock; the action pin does not cover the binary
          enable-cache: false
      # Without this, a missing secret makes the Supabase tests skip and the run goes green.
      - name: Require the Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing or empty in the 'ci' environment"
              missing=1
            fi
          done
          exit "$missing"
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - name: Write frontend/js/config.js
        working-directory: frontend/js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        # 127.0.0.1, not localhost: localhost may resolve to IPv6 on the runner while uvicorn binds 127.0.0.1.
        run: |
          printf '%s\n' \
            'export const config = {' \
            '  apiUrl: "http://127.0.0.1:8000",' \
            "  supabaseUrl: \"$SUPABASE_URL\"," \
            "  supabasePublishableKey: \"$SUPABASE_PUBLISHABLE_KEY\"," \
            '};' > config.js
      - name: Run the tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
        run: uv run --locked pytest --tb=short -rs

  backend-unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          version: "0.8.11" # the uv that wrote uv.lock; the action pin does not cover the binary
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked pytest --tb=short
